<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Franchise Mapping</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #0e1013);
    --card: var(--tg-theme-secondary-bg-color, #16191f);
    --card-2: color-mix(in srgb, var(--card) 80%, var(--text) 5%);
    --text: var(--tg-theme-text-color, #eef1f5);
    --hint: var(--tg-theme-hint-color, #8a94a2);
    --accent: var(--tg-theme-button-color, #4b8dff);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --danger:#ff5468; --warn:#f5a524;
    --line: color-mix(in srgb, var(--text) 10%, transparent);
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    padding-bottom:100px;overscroll-behavior:none}
  header{position:sticky;top:0;z-index:5;
    background:linear-gradient(var(--bg),color-mix(in srgb,var(--bg) 60%,transparent));
    backdrop-filter:blur(10px);padding:18px 18px 12px}
  h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
  .sub{color:var(--hint);font-size:12.5px;margin-top:4px}
  .wrap{padding:4px 12px 12px}
  .section{margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
  .section h2{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--hint);
    font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .section .count{font-size:11px;color:var(--hint);background:var(--card);
    padding:2px 9px;border-radius:20px;flex:0 0 auto}
  .section.unsure h2{color:var(--warn)}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-height:6px}
  li{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:9px 10px 9px 6px;
    transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .16s,border-color .16s,opacity .16s;
    touch-action:pan-y}
  li.dragging{opacity:.97;border-color:var(--accent);
    box-shadow:0 12px 34px -10px rgba(0,0,0,.6);transform:scale(1.02);z-index:10;position:relative}
  .unsure li{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
  .grip{display:flex;align-items:center;justify-content:center;color:var(--hint);
    width:24px;height:36px;flex:0 0 auto;cursor:grab;touch-action:none;border-radius:8px}
  .grip:active{cursor:grabbing;background:color-mix(in srgb,var(--text) 8%,transparent)}
  .grip svg{width:16px;height:16px;opacity:.7}
  .num{flex:0 0 auto;min-width:28px;height:28px;border-radius:9px;
    background:color-mix(in srgb,var(--accent) 16%,transparent);
    color:var(--accent);font-weight:700;font-size:12.5px;display:flex;align-items:center;
    justify-content:center;padding:0 7px}
  .unsure .num{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .meta{flex:1 1 auto;min-width:0}
  .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13.5px}
  .eptitle{color:var(--hint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .tags{color:var(--hint);font-size:10.5px;margin-top:2px;letter-spacing:.02em}
  .arrows{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
  .arrows button{border:0;background:transparent;color:var(--hint);width:28px;height:17px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px;padding:0}
  .arrows button:active{background:color-mix(in srgb,var(--text) 10%,transparent);color:var(--text)}
  .arrows button[disabled]{opacity:.22;pointer-events:none}
  .arrows svg{width:15px;height:15px}
  .pick{flex:0 0 auto;background:var(--card-2);color:var(--text);border:1px solid var(--line);
    border-radius:9px;padding:7px 6px;font-size:12px;font-weight:600;max-width:104px;
    -webkit-appearance:none;appearance:none;text-align:center}
  .iconbtn{flex:0 0 auto;border:0;background:transparent;color:var(--hint);width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;border-radius:9px;cursor:pointer}
  .iconbtn svg{width:17px;height:17px}
  .del:active{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}
  .restore:active{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .excluded li{opacity:.6}
  .excluded .num{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
  .empty{color:var(--hint);font-size:12px;padding:9px 12px;border:1px dashed var(--line);
    border-radius:var(--radius);opacity:.7}
  footer{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent,var(--bg) 34%)}
  button.save{width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--accent-text);
    font-weight:700;font-size:15px;padding:15px;cursor:pointer;letter-spacing:.01em;
    box-shadow:0 6px 20px -6px color-mix(in srgb,var(--accent) 60%,transparent);transition:opacity .15s}
  button.save[disabled]{opacity:.5;box-shadow:none}
  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(6px);
    background:var(--card);border:1px solid var(--line);color:var(--text);padding:10px 16px;
    border-radius:22px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;
    pointer-events:none;box-shadow:0 8px 24px -8px rgba(0,0,0,.5);max-width:80%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading{padding:48px 16px;text-align:center;color:var(--hint)}
</style>
</head>
<body>
<header>
  <h1 id="title">Franchise Mapping</h1>
  <div class="sub">Assign each file to a section · drag or use arrows to reorder · remove non-episodes</div>
</header>
<div class="wrap" id="root"><div class="loading">Loading…</div></div>
<footer><button class="save" id="save" disabled>Save mapping</button></footer>
<div class="toast" id="toast"></div>
<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

const TOKEN = location.pathname.split("/").pop();
const INIT = (tg && tg.initData) || "";
const UNSURE = "__unsure__";
const state = { title:"", sections:[], files:[] };  // files: {..., section_id|null, excluded}

const SVG = {
  grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>',
  restore:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/></svg>',
};

function toast(m){ const t=document.getElementById("toast"); t.textContent=m;
  t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1900); }
function haptic(k){ try{ if(!tg||!tg.HapticFeedback) return;
  if(k==="impact") tg.HapticFeedback.impactOccurred("light"); else tg.HapticFeedback.selectionChanged();
}catch(e){} }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function api(method, body){
  const r = await fetch(`/api/map/${TOKEN}`, {
    method, headers:{"Content-Type":"application/json","X-Init-Data":INIT},
    body: body?JSON.stringify(body):undefined });
  if(!r.ok){ throw new Error((await r.json().catch(()=>({}))).detail || r.status); }
  return r.json();
}

function sectionById(id){ return state.sections.find(s=>s.section_id===id) || null; }
function filesIn(id){ // included files currently assigned to section id (array order)
  return state.files.filter(f=>!f.excluded && f.section_id===id);
}

function pickOptions(current){
  const opts = state.sections.map(s=>
    `<option value="${s.section_id}" ${s.section_id===current?"selected":""}>${esc(s.label)}</option>`);
  opts.push(`<option value="${UNSURE}" ${current==null?"selected":""}>Unsure</option>`);
  return opts.join("");
}

function render(){
  const root = document.getElementById("root");
  document.getElementById("title").textContent = state.title || "Franchise Mapping";
  let html = "";
  // A box per franchise entry — shown even when empty.
  for(const s of state.sections){
    const list = filesIn(s.section_id);
    html += `<div class="section"><h2>${esc(s.label)}</h2>
      <span class="count">${list.length}${s.expected?` / ${s.expected}`:""}</span></div>`;
    html += `<ul data-section="${s.section_id}">`;
    if(list.length) list.forEach((f,i)=>{ html += row(f,i+1,i===0,i===list.length-1); });
    else html += `<div class="empty">Empty — drag files here or use each file's picker.</div>`;
    html += `</ul>`;
  }
  // Unsure bucket (only when it has files).
  const unsure = state.files.filter(f=>!f.excluded && f.section_id==null);
  if(unsure.length){
    html += `<div class="section unsure"><h2>Unsure — assign these</h2>
      <span class="count">${unsure.length}</span></div><ul data-section="${UNSURE}">`;
    unsure.forEach((f,i)=>{ html += row(f,i+1,true,true); });
    html += `</ul>`;
  }
  // Excluded.
  const ex = state.files.filter(f=>f.excluded);
  html += `<div class="section"><h2>Excluded — not an episode</h2><span class="count">${ex.length}</span></div>`;
  if(ex.length){ html += `<ul class="excluded">`; ex.forEach(f=>{ html += exRow(f); }); html += `</ul>`; }
  else html += `<div class="empty">Nothing excluded.</div>`;
  root.innerHTML = html;
  wire();
  document.getElementById("save").disabled = false;
}

function row(f,pos,isFirst,isLast){
  const tags = (f.resolutions&&f.resolutions.length)? f.resolutions.join(" · ") : "";
  return `<li data-index="${f.index}">
    <span class="grip" data-index="${f.index}" aria-label="Drag">${SVG.grip}</span>
    <span class="num">${pos}</span>
    <div class="meta">
      <div class="name">${esc(f.name)}</div>
      ${f.ep_title?`<div class="eptitle">${esc(f.ep_title)}</div>`:""}
      ${tags?`<div class="tags">${esc(tags)}</div>`:""}
    </div>
    <div class="arrows">
      <button class="mv" data-index="${f.index}" data-dir="-1" ${isFirst?"disabled":""} aria-label="Up">${SVG.up}</button>
      <button class="mv" data-index="${f.index}" data-dir="1" ${isLast?"disabled":""} aria-label="Down">${SVG.down}</button>
    </div>
    <select class="pick" data-index="${f.index}">${pickOptions(f.section_id)}</select>
    <button class="iconbtn del" data-index="${f.index}" aria-label="Exclude">${SVG.del}</button>
  </li>`;
}
function exRow(f){
  return `<li data-index="${f.index}">
    <span class="num">×</span>
    <div class="meta"><div class="name">${esc(f.name)}</div></div>
    <button class="iconbtn restore" data-index="${f.index}" aria-label="Restore">${SVG.restore}</button>
  </li>`;
}

function wire(){
  document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{
    const f=byIndex(+b.dataset.index); if(f){ f.excluded=true; haptic("impact"); render(); } });
  document.querySelectorAll(".restore").forEach(b=>b.onclick=()=>{
    const f=byIndex(+b.dataset.index); if(f){ f.excluded=false; haptic("impact"); render(); } });
  document.querySelectorAll(".mv").forEach(b=>b.onclick=()=>move(+b.dataset.index,+b.dataset.dir));
  document.querySelectorAll(".pick").forEach(sel=>sel.onchange=()=>{
    const f=byIndex(+sel.dataset.index);
    if(f){ f.section_id = sel.value===UNSURE ? null : sel.value; haptic("select"); render(); } });
  document.querySelectorAll(".grip").forEach(g=>g.addEventListener("pointerdown", startDrag));
}
function byIndex(i){ return state.files.find(f=>f.index===i); }

// Swap with the adjacent sibling in the SAME section (array order).
function move(index, dir){
  const f = byIndex(index); if(!f) return;
  const sibs = state.files.filter(x=>!x.excluded && x.section_id===f.section_id);
  const p = sibs.indexOf(f); const other = sibs[p+dir];
  if(!other) return;
  const ai = state.files.indexOf(f), bi = state.files.indexOf(other);
  [state.files[ai], state.files[bi]] = [state.files[bi], state.files[ai]];
  haptic("select"); render();
}

// ── Pointer-events drag (works on touch, unlike native HTML5 drag) ──────────
let drag = null;
function startDrag(e){
  const li = e.target.closest("li"); if(!li) return;
  e.preventDefault();
  drag = { index:+li.dataset.index, li, startY:e.clientY, moved:false };
  li.setPointerCapture && li.setPointerCapture(e.pointerId);
  document.addEventListener("pointermove", onDrag);
  document.addEventListener("pointerup", endDrag, {once:true});
  document.addEventListener("pointercancel", endDrag, {once:true});
}
function onDrag(e){
  if(!drag) return;
  if(!drag.moved){
    if(Math.abs(e.clientY - drag.startY) < 6) return;
    drag.moved = true; drag.li.classList.add("dragging"); haptic("impact");
  }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const overUl = el && el.closest && el.closest("ul[data-section]");
  const overLi = el && el.closest && el.closest("li[data-index]");
  if(overUl && overUl.classList.contains("excluded")) return; // don't drag into excluded
  const dragF = byIndex(drag.index); if(!dragF) return;
  // Determine the target section (the list under the finger).
  const targetSection = overUl ? overUl.dataset.section : null;
  if(targetSection != null){
    dragF.section_id = (targetSection===UNSURE) ? null : targetSection;
  }
  // Reorder relative to the row under the finger, when it's a different file.
  if(overLi && +overLi.dataset.index !== drag.index){
    const overF = byIndex(+overLi.dataset.index);
    if(overF && !overF.excluded){
      dragF.section_id = overF.section_id;
      const from = state.files.indexOf(dragF); state.files.splice(from,1);
      const to = state.files.indexOf(overF);
      const rect = overLi.getBoundingClientRect();
      const after = e.clientY > rect.top + rect.height/2;
      state.files.splice(after?to+1:to, 0, dragF);
    }
  }
  render();
  const fresh = document.querySelector(`li[data-index="${drag.index}"]`);
  if(fresh){ drag.li = fresh; fresh.classList.add("dragging"); }
}
function endDrag(){
  document.removeEventListener("pointermove", onDrag);
  if(drag && drag.li) drag.li.classList.remove("dragging");
  const moved = drag && drag.moved; drag = null;
  if(moved){ haptic("select"); render(); }
}

// Layout for the API: each included+assigned file → {index, kind, season, position}
// (position = 1-based order within its section). Unsure files are omitted (stay
// unmatched); excluded files go in the excluded list.
function buildLayout(){
  const perSection = {}; const files = [];
  for(const f of state.files){
    if(f.excluded || f.section_id==null) continue;
    const sec = sectionById(f.section_id); if(!sec) continue;
    perSection[f.section_id] = (perSection[f.section_id]||0) + 1;
    files.push({index:f.index, kind:sec.kind, season:sec.season_number,
                position:perSection[f.section_id]});
  }
  return { files, excluded: state.files.filter(f=>f.excluded).map(f=>f.index) };
}

async function save(){
  const unsure = state.files.filter(f=>!f.excluded && f.section_id==null).length;
  if(unsure){ toast(`Assign the ${unsure} unsure file${unsure>1?"s":""} first (or exclude them)`); return; }
  const btn = document.getElementById("save"); btn.disabled=true; btn.textContent="Saving…";
  try{
    await api("POST", { init_data:INIT, layout:buildLayout() });
    toast("Saved");
    if(tg){ try{ tg.HapticFeedback.notificationOccurred("success"); }catch(e){}
      setTimeout(()=>tg.close(), 650); }
  }catch(err){ toast("Save failed: "+err.message); btn.disabled=false; btn.textContent="Save mapping"; }
}

async function load(){
  try{
    const data = await api("GET");
    state.title = data.title; state.sections = data.sections || [];
    state.files = (data.files||[]).map(f=>({
      index:f.index, name:f.name, ep_title:f.ep_title||"", resolutions:f.resolutions||[],
      section_id: (f.section_id!=null ? f.section_id : null),
      // Genuine junk (trailers/NC/previews → kind "extra") starts excluded;
      // everything else keeps its section, or lands in Unsure for the owner to
      // confirm. Specials stay assignable (never auto-excluded).
      excluded: f.kind==="extra",
    }));
    render();
  }catch(err){
    document.getElementById("root").innerHTML =
      `<div class="loading">Couldn't load this mapping.<br><small>${esc(err.message)}</small></div>`;
  }
}
document.getElementById("save").onclick = save;
load();
</script>
</body>
</html>
